spring.application.name=backend_lang

# PostgreSQL Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/backend_lang}
spring.datasource.username=${DB_USERNAME:ad1tyq}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Payment Webhook Security
app.payment.webhook-secret=${PAYMENT_WEBHOOK_SECRET:sec_test_webhook_key_12345}
